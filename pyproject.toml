[project]
name = "netprobe-lite"
version = "1.4.3"
description = "Simple and effective tool for measuring ISP performance at home."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dnspython==2.8.0",
    "prometheus-client==0.23.1",
    "pydantic>=2.10.6",
    "requests==2.32.5",
    "python-dotenv==1.2.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.1.0",
]

[tool.ruff.lint]
ignore = ["BLE001"]
